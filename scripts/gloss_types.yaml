supported_css_styles:
  - basic_gloss
  - standout_italic
  - flowing_text
  - fine_print

types:
  - data_type: tika
    css_style: basic_gloss
    label_from_attr: data-name
    hideable: true
    #boxed: closed
    hidden_by_default: false

  - data_type: kosha
    css_style: basic_gloss
    label: "कोशः"
    hideable: true
    hidden_by_default: false

  - data_type: udaharana
    css_style: standout_italic
    hideable: true
    hidden_by_default: false
  - data_type: vritti
    css_style: flowing_text
    label: "वृत्तिः"
    hideable: false
    hidden_by_default: false
