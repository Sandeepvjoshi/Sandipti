<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मराठी मजकूर</title>
  <style>
    body {
      font-family: "Noto Sans Devanagari", sans-serif;
      line-height: 1.8;
      margin: 30px;
    }

    .marathi {
      text-align: justify;
    }
  </style>
</head>
<body>
  <p class="marathi" lang="mr">
    मराठी ही महाराष्ट्राची प्रमुख भाषा आहे.
    देवनागरी लिपीमध्ये लिहिलेला हा परिच्छेद
    दोन्ही बाजूंनी समान रेषेत दिसण्यासाठी
    Justify Alignment वापरले आहे.
  </p>
</body>
</html>
